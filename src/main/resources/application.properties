spring.application.name=cen4802

# Application logging
logging.level.root=INFO
logging.level.com.oshhhtv.cen4802=INFO

# Record logs to both the console and a local file.
logging.file.name=logs/release-readiness.log

# Include time, severity, thread, logger and message context.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n