apiVersion: apps/v1
kind: Deployment
metadata:
  name: cen4802-readiness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cen4802-readiness
  template:
    metadata:
      labels:
        app: cen4802-readiness
    spec:
      containers:
        - name: readiness-checker
          image: cen4802-readiness:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080